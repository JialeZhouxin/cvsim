[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "cvsim"
version     = "0.1.0"
description = "CV photonic quantum simulators: Gaussian / Fock / Bosonic — theory-first, minimal deps."
license     = { text = "MIT" }
readme      = "README.md"
authors     = [
    { name = "cv-photonic-notes contributors" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
lab = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.urls]
Homepage  = "https://github.com/turingQ/cv-photonic-notes"
"Bug Tracker" = "https://github.com/turingQ/cv-photonic-notes/issues"
Documentation = "https://github.com/turingQ/cv-photonic-notes#readme"

[tool.setuptools.packages.find]
include = ["cvsim*"]

[tool.setuptools.package-data]
"cvsim.lab" = ["static/*"]

[tool.ruff]
target-version = "py310"
line-length    = 100

[tool.ruff.lint]
select = [
    # pyflakes (F)
    "F",
    # pycodestyle (E, W)
    "E", "W",
    # isort (I)
    "I",
    # flake8-bugbear (B)
    "B",
    # flake8-comprehensions (C4)
    "C4",
    # flake8-simplify (SIM)
    "SIM",
    # flake8-return (RET)
    "RET",
    # flake8-raise (RSE)
    "RSE",
    # pyupgrade (UP) — auto-modernize syntax
    "UP",
]
ignore = [
    # Allow 1-char variable names in physics code (e.g. r, V, S, d)
    "F841",
]

[tool.ruff.lint.isort]
known-first-party = ["cvsim"]

[tool.ruff.format]
quote-style          = "double"
indent-style         = "space"
skip-magic-trailing-comma = false
line-ending          = "lf"

[tool.mypy]
python_version          = "3.10"
strict                  = true
ignore_missing_imports  = true
disallow_untyped_defs   = false
warn_return_any         = true
warn_unreachable        = true
exclude                 = ["tests/"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
minversion    = "8"
testpaths     = ["tests"]
python_files  = ["test_*.py"]
addopts       = [
    "-ra",
    "--strict-markers",
    "--tb=short",
]
filterwarnings = [
    "error:cvsim.*",
    "ignore::DeprecationWarning:scipy.*",
]

[tool.coverage.run]
source   = ["cvsim"]
branch   = true
omit     = ["cvsim/demos/*"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
show_missing = true
skip_covered = false
