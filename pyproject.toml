[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "cvsim"
version     = "0.1.0"
description = "CV photonic quantum simulators: Gaussian / Fock / Bosonic — theory-first, minimal deps."
license     = { text = "MIT" }
readme      = "README.md"
authors     = [
    { name = "cv-photonic-notes contributors" },
]
requires-python = ">=3.10,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
gbs = [
    "thewalrus>=0.22,<0.23",  # 仅 0.22.0 实测确认（xxpp 约定），见 docs/gbs-walrus.md 版本注
]
sf = [
    "strawberryfields>=0.23,<0.24",  # 对照脚本 docs/sf-roundtrip.md；非运行时依赖。PyPI 最新 0.23.0（2022-06），0.24 从未发布
]
jax = [
    "jax[cpu]>=0.4",  # 可微后端（Phase 4 F-AD）；Windows CPU 官方支持
]
lab = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.urls]
Homepage  = "https://github.com/turingQ/cv-photonic-notes"
"Bug Tracker" = "https://github.com/turingQ/cv-photonic-notes/issues"
Documentation = "https://github.com/turingQ/cv-photonic-notes#readme"

[tool.setuptools.packages.find]
include = ["cvsim*"]

[tool.setuptools.package-data]
"cvsim.lab" = ["static/*"]

[tool.ruff]
target-version = "py310"
line-length    = 100
# 教学材料与一次性工具不按库代码 lint 标准（169 处错全在此带，2026-08-31 实证）；
# 库本体 cvsim/ + 测试 + examples/ + scripts/ 保持全检。
extend-exclude = [
    "tutorials",
    "tools",
]

[tool.ruff.lint]
select = [
    # pyflakes (F)
    "F",
    # pycodestyle (E, W)
    "E", "W",
    # isort (I)
    "I",
    # flake8-bugbear (B)
    "B",
    # flake8-comprehensions (C4)
    "C4",
    # flake8-simplify (SIM)
    "SIM",
    # flake8-return (RET)
    "RET",
    # flake8-raise (RSE)
    "RSE",
    # pyupgrade (UP) — auto-modernize syntax
    "UP",
]
ignore = [
    # Allow 1-char variable names in physics code (e.g. r, V, S, d)
    "F841",
]

[tool.ruff.lint.isort]
known-first-party = ["cvsim"]

[tool.ruff.format]
quote-style          = "double"
indent-style         = "space"
skip-magic-trailing-comma = false
line-ending          = "lf"

[tool.mypy]
# 不钉 python_version：随当前解释器检查。lock 按 Python 分流 numpy
# （3.10→2.2.6 / 3.12+→2.5.1），2.5.1 stubs 用 PEP 695 type 语句，
# 钉 3.10 会让 3.12 job 按 3.10 语法解析自家 stubs 直接报 syntax 错
# （CI 33368075232 实证）。
strict                  = true
ignore_missing_imports  = true
disallow_untyped_defs   = false
# numpy 2.2（py3.10 唯一可用）stubs 要求 ndarray 带泛型参数，2.4（py3.11+）
# 不要求——192 处 type-arg 只在 3.10 矩阵爆发（2026-08-31 实证）。裸 ndarray
# 注解保留，关闭此项对齐两端行为。
disallow_any_generics   = false
warn_return_any         = true
warn_unreachable        = true
exclude                 = ["tests/"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
minversion    = "8"
testpaths     = ["tests"]
python_files  = ["test_*.py"]
addopts       = [
    "-ra",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "phaseB1: Bosonic B1 tests (gates/channels/measures K=1 alignment + freeze)",
    "phaseB2: Bosonic B2 component engineering tests",
    "phaseB3: Bosonic B3 measurement precision tests",
    "phaseB4: Bosonic B4 reconciliation suite tests",
    "phaseB5: Bosonic B5 circuit DSL tests",
    "phaseB6: Bosonic B6 GUI three-piece tests",
    "phaseB7: Bosonic B7 complex-centre analyse kernel tests",
    "phaseB8: Bosonic B8 non-Gaussian kerr gate tests",
    "phaseB10: Bosonic B10 joint multimode PNR probability/sampling tests",
]
filterwarnings = [
    "error:cvsim.*",
    "ignore::DeprecationWarning:scipy.*",
]

[tool.coverage.run]
source   = ["cvsim"]
branch   = true
omit     = ["cvsim/demos/*"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
show_missing = true
skip_covered = false
