name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 环境一律经 uv sync --frozen 从 uv.lock 装（与本地验证环境逐版本一致，
# 且不做任何重新解析——裸 pip install 会拉到未测过的最新 numpy/mypy，
# 2026-08-31 实证：mypy 2.3.1 + numpy 2.5.2 在 strict 下全库报 ndarray
# type-arg，锁定环境 0 错）。

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check --output-format=github"

  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python ${{ matrix.python-version }} --extra dev
      - run: uv run --no-sync mypy cvsim/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python ${{ matrix.python-version }} --extra dev
      - run: uv run --no-sync python -m pytest tests/ -q --tb=short
      - run: uv run --no-sync python -m pytest tests/ --cov=cvsim --cov-report=term-missing
        if: matrix.python-version == '3.12'

  # -----------------------------------------------------------------------
  # Guardrail: enforce that public API does not regress (no accidental
  # private-symbol leaks in demos/examples).
  # -----------------------------------------------------------------------
  api-freeze:
    name: API Freeze Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12 --extra dev
      - run: uv run --no-sync python -m pytest tests/test_public_api.py -q -v

  # -----------------------------------------------------------------------
  # Benchmark (vision Phase 3 exit #2/#5): m=100 compile+run must stay
  # under the time budget (default 2s in the script) or CI fails.
  # -----------------------------------------------------------------------
  benchmark:
    name: Benchmark (m=100, budget 2s)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12 --extra dev
      - run: uv run --no-sync python benchmarks/benchmark_m100.py

  # -----------------------------------------------------------------------
  # GBS interop (vision Phase 3 exit #4): core test jobs install only
  # ".[dev]" so thewalrus is absent and the comparison layer skips via
  # importorskip; this job installs the optional cvsim[gbs] extra and
  # runs the full suite including the walrus 对拍层.
  # -----------------------------------------------------------------------
  gbs:
    name: Test (gbs extra)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12 --extra dev --extra gbs
      - run: uv run --no-sync python -m pytest tests/ -q --tb=short
